name: Feature request or idea
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who is affected (residents, officials, developers...) and how?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your city, country or organisation, if you're reusing this tool, and anything else that helps us understand.
